[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-data-structures-toolkit"
version = "0.1.0"
description = "Bloom filter, Count-Min Sketch, and HyperLogLog implemented from scratch, with a CLI that compares each against the exact answer."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pdst = "pdst.cli:main"

[tool.setuptools.packages.find]
include = ["pdst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
